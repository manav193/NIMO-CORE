name: Deploy NIMO Worker Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - '.github/workflows/deploy-worker-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: nimo-core-production-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax validation
        run: npm run lint

      - name: Server regression tests
        run: node --test tests/server/server.test.js

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${{ secrets.OPENROUTER_API_KEY }}" || { echo 'Missing OPENROUTER_API_KEY'; exit 1; }

      - name: Configure OpenRouter secret
        shell: bash
        run: printf '%s' '${{ secrets.OPENROUTER_API_KEY }}' | npx wrangler secret put OPENROUTER_API_KEY

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Remove temporary hotfix workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/deploy-worker-hotfix.yml
          git commit -m 'chore: remove worker deployment hotfix workflow'
          git push
