name: Integrate PromptAI Knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-prompt-aii-knowledge.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register PromptAI source in runtime entrypoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/server/server.js': [
                  ("import { ARCADE_OS_PROJECTS_SOURCE } from '../knowledge/sources/arcade-os-projects.js';\n", "import { ARCADE_OS_PROJECTS_SOURCE } from '../knowledge/sources/arcade-os-projects.js';\nimport { PROMPT_AII_SOURCE } from '../knowledge/sources/prompt-aii.js';\n"),
                  ("adapters: [createGenericProjectAdapter({ source: ARCADE_OS_PROJECTS_SOURCE })]", "adapters: [\n      createGenericProjectAdapter({ source: ARCADE_OS_PROJECTS_SOURCE }),\n      createGenericProjectAdapter({ source: PROMPT_AII_SOURCE })\n    ]")
              ],
              'src/worker.js': [
                  ("import { ARCADE_OS_PROJECTS_SOURCE } from './knowledge/sources/arcade-os-projects.js';\n", "import { ARCADE_OS_PROJECTS_SOURCE } from './knowledge/sources/arcade-os-projects.js';\nimport { PROMPT_AII_SOURCE } from './knowledge/sources/prompt-aii.js';\n"),
                  ("adapters: [createGenericProjectAdapter({ source: ARCADE_OS_PROJECTS_SOURCE })]", "adapters: [\n      createGenericProjectAdapter({ source: ARCADE_OS_PROJECTS_SOURCE }),\n      createGenericProjectAdapter({ source: PROMPT_AII_SOURCE })\n    ]")
              ]
          }

          for filename, pairs in replacements.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected pattern not found in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY

      - name: Validate
        run: |
          npm install
          npm test

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/server.js src/worker.js src/knowledge/sources/prompt-aii.js
          git commit -m "feat: integrate PromptAI knowledge source" || true
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/integrate-prompt-aii-knowledge.yml
          git commit -m "chore: remove temporary PromptAI integration workflow"
          git push
