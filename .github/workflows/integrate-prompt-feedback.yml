name: Integrate Prompt-Aii Feedback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-prompt-feedback.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire feedback learning endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/server.js')
          text = p.read_text()
          old = "import { createOpenRouterProvider } from '../services/openrouter.js';\n"
          new = old + "import { createInMemoryLearningStore } from '../learning/store.js';\nimport { createPromptAiiLearningEvent } from '../learning/prompt-aii-events.js';\n"
          if "createPromptAiiLearningEvent" not in text:
              if old not in text: raise SystemExit('server import marker not found')
              text = text.replace(old, new, 1)
          old = "  engine = null,\n  aiProvider = null,\n  rateLimiter = null\n} = {}) {\n  const nimoEngine = engine || createNimoEngine({"
          new = "  engine = null,\n  aiProvider = null,\n  rateLimiter = null,\n  learningStore = null\n} = {}) {\n  const feedbackLearningStore = learningStore || createInMemoryLearningStore();\n  const nimoEngine = engine || createNimoEngine({"
          if old in text and 'const feedbackLearningStore' not in text:
              text = text.replace(old, new, 1)
          old = "      createGenericProjectAdapter({ source: PROMPT_AII_SOURCE })\n    ]\n  });"
          new = "      createGenericProjectAdapter({ source: PROMPT_AII_SOURCE })\n    ],\n    learningStore: feedbackLearningStore\n  });"
          if old in text and 'learningStore: feedbackLearningStore' not in text:
              text = text.replace(old, new, 1)
          marker = "    // POST /api/nimo/chat or POST /v1/chat\n"
          route = '''    // POST /api/nimo/feedback — sanitized Prompt-Aii feedback observation\n    if (pathname === '/api/nimo/feedback') {\n      if (req.method !== 'POST') {\n        res.writeHead(405, { 'Content-Type': 'application/json' });\n        res.end(JSON.stringify({ success: false, error: 'Method Not Allowed' }));\n        return;\n      }\n      const configuredKey = process.env.NIMO_INTEGRATION_KEY;\n      const suppliedKey = req.headers['x-nimo-integration-key'];\n      if (configuredKey && suppliedKey !== configuredKey) {\n        res.writeHead(401, { 'Content-Type': 'application/json' });\n        res.end(JSON.stringify({ success: false, error: 'Unauthorized' }));\n        return;\n      }\n      let body = '';\n      let bytesRead = 0;\n      let bodyTooLarge = false;\n      req.on('data', chunk => {\n        bytesRead += chunk.length;\n        if (bytesRead > 16 * 1024) {\n          bodyTooLarge = true;\n          req.pause();\n          res.writeHead(413, { 'Content-Type': 'application/json' });\n          res.end(JSON.stringify({ success: false, error: 'Payload Too Large' }));\n          return;\n        }\n        body += chunk;\n      });\n      req.on('end', async () => {\n        if (bodyTooLarge) return;\n        let parsed;\n        try { parsed = JSON.parse(body); } catch {\n          res.writeHead(400, { 'Content-Type': 'application/json' });\n          res.end(JSON.stringify({ success: false, error: 'Invalid JSON payload' }));\n          return;\n        }\n        const feedback = typeof parsed?.feedback === 'string' ? parsed.feedback.trim().toLowerCase() : '';\n        if (!['like', 'dislike'].includes(feedback)) {\n          res.writeHead(400, { 'Content-Type': 'application/json' });\n          res.end(JSON.stringify({ success: false, error: 'Feedback must be like or dislike' }));\n          return;\n        }\n        const event = createPromptAiiLearningEvent({\n          requestId: parsed.request_id || requestId,\n          input: typeof parsed.idea === 'string' ? parsed.idea : '',\n          target: parsed.target || 'prompt-generation',\n          model: parsed.model || null,\n          strategy: parsed.strategy || null,\n          outcome: feedback === 'like' ? 'success' : 'failure',\n          feedback: { type: feedback, reason: parsed.reason || null },\n          metadata: { category: parsed.category || null, feedbackSource: 'prompt-aii-ui' }\n        });\n        try { await feedbackLearningStore.record(event); } catch {\n          res.writeHead(500, { 'Content-Type': 'application/json' });\n          res.end(JSON.stringify({ success: false, error: 'Learning event could not be recorded' }));\n          return;\n        }\n        res.writeHead(202, { 'Content-Type': 'application/json' });\n        res.end(JSON.stringify({ success: true, accepted: true, learning_event_id: event.id }));\n      });\n      return;\n    }\n\n'''
          if "pathname === '/api/nimo/feedback'" not in text:
              if marker not in text: raise SystemExit('chat route marker not found')
              text = text.replace(marker, route + marker, 1)
          p.write_text(text)
          PY

      - name: Add feedback bridge client
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/prompt-ai.js')
          text = p.read_text()
          marker = "  async compile({ message, context = {}, executionTarget = 'browser', model = 'NIMO', requestId = null } = {}) {"
          method = '''  async recordFeedback({ requestId = null, idea = '', feedback, reason = null, model = null, category = null, target = 'prompt-generation', strategy = null } = {}) {\n    const normalized = String(feedback || '').trim().toLowerCase();\n    if (!['like', 'dislike'].includes(normalized)) return { success: false, error: 'INVALID_FEEDBACK' };\n    if (!this.isConfigured()) return { success: false, error: 'PROMPT_AI_NOT_CONFIGURED' };\n    try {\n      const response = await this.fetch(`${this.baseUrl}/api/nimo/feedback`, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'X-NIMO-Integration-Key': this.integrationKey, ...(requestId ? { 'X-Request-ID': requestId } : {}) },\n        body: JSON.stringify({ request_id: requestId, idea, feedback: normalized, reason, model, category, target, strategy })\n      });\n      let data = null;\n      try { data = await response.json(); } catch {}\n      return response.ok ? data || { success: true } : { success: false, error: data?.error || `HTTP_${response.status}` };\n    } catch { return { success: false, error: 'FEEDBACK_NETWORK_FAILURE' }; }\n  }\n\n'''
          if 'async recordFeedback(' not in text:
              if marker not in text: raise SystemExit('prompt client marker not found')
              text = text.replace(marker, method + marker, 1)
          p.write_text(text)
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/server.js src/services/prompt-ai.js
          git rm .github/workflows/integrate-prompt-feedback.yml
          git commit -m 'feat(learning): ingest Prompt-Aii feedback into NIMO events'
          git push
